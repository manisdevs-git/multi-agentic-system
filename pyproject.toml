[project]
name = "support-reply"
version = "0.0.1"
description = "Groww multi-agent support reply drafts."
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",
  "langgraph>=0.2",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "streamlit>=1.57",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Core Pydantic V1 functionality isn't compatible:UserWarning",
]
