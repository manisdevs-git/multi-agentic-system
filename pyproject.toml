[project]
name = "support-reply"
version = "0.0.1"
description = "Groww multi-agent support reply drafts."
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0",
  "groq>=0.13",
  "langgraph>=0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Core Pydantic V1 functionality isn't compatible:UserWarning",
]
